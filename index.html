<title>RICHBOI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="RICHBOI 周譽">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+TC:wght@300;400&display=swap">
<style>
/* Layout: one continuous grey field — name + planet, two covers on one grid, contact; metallic blue only in the planet's ring. Single committed look; one wide grotesk for display words, nothing decorative. */
:root{
  --grey:#D6D8DC; --grey-2:#BFC3C9; --ink:#0B0C0F; --black:#0A0B0D; --steel:#9DBCD0; --steel-hi:#D7E6EF; --steel-lo:#7FA3BB; --dim:#8D939C;
  --f-goth:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
body{background:var(--grey);color:var(--ink);font-family:var(--f-tc);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:center;text-align:center}
.goth{font-family:var(--f-goth);font-weight:600;font-stretch:125%;font-variation-settings:'wdth' 125;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.sm{display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
.sm a{opacity:.62;transition:opacity .2s}.sm a:hover{opacity:1}

/* hero */
.hero{position:relative;overflow:hidden;min-height:min(78svh,760px);display:grid;align-items:center;background:var(--grey)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;width:100%;padding-block:5rem;gap:.9rem}
.wordmark{display:inline-block;max-width:100%;margin:0;white-space:nowrap;font-size:clamp(3rem,20vw,9rem);color:var(--ink)}
.cn{margin:0;font-weight:400;font-size:clamp(1.6rem,5vw,2.6rem);color:var(--ink);letter-spacing:.55em;padding-left:.55em}

/* releases */
.releases{background:var(--grey);color:var(--ink)}
.releases .wrap{padding-block:clamp(4.5rem,12vw,8rem)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(3.5rem,6vw,4.5rem) clamp(1.5rem,4vw,3rem);width:100%}
.rel{display:grid;gap:1.4rem;justify-items:center;min-width:0}
.rel img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1;object-fit:cover}
.rel h2{margin:0;font-size:clamp(1.3rem,3.4vw,1.8rem);color:var(--ink)}
.listen{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;padding:.75rem 1.4rem;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s}
.listen:hover{background:var(--ink);color:var(--grey)}

/* contact: metallic light blue */
.contact{background:var(--grey);color:var(--ink)}
.contact .wrap{padding-block:clamp(4.5rem,12vw,7rem);gap:1.6rem}
.contact h2{margin:0;font-size:clamp(1.3rem,4vw,1.8rem)}
.mail{font-family:var(--f-mono);font-size:clamp(.95rem,3.6vw,1.25rem);letter-spacing:.04em;word-break:break-all;user-select:all}

footer{background:var(--grey);color:#6E747D}
footer .wrap{padding-block:1.4rem;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em}

@media (max-width:640px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    ctx.strokeStyle='rgba('+INK+','+0.14*k+')';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    ring(true);
  }
  function loop(t){if(t-last>33){draw(t);last=t}if(!reduce)requestAnimationFrame(loop)}
  size();draw(20000);
  window.addEventListener('resize',function(){size();draw(last||20000)});
  if(!reduce)requestAnimationFrame(loop);
})();
(function(){
  var el=document.querySelector('.wordmark');if(!el)return;
  function fit(){
    var p=el.parentElement,cs=getComputedStyle(p);
    var w=p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    el.style.fontSize='100px';
    var tw=el.getBoundingClientRect().width;
    if(tw>0) el.style.fontSize=Math.floor(Math.min(w/tw*100,200)*0.94)+'px';
  }
  fit();
  if(document.fonts){document.fonts.ready.then(fit);if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',fit)}
